<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 背景圆形 -->
  <circle cx="32" cy="32" r="30" fill="#f0f9ff" stroke="#0369a1" stroke-width="2"/>
  
  <!-- 算法符号 A -->
  <text x="32" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0369a1" text-anchor="middle">A</text>
  
  <!-- 装饰性齿轮 -->
  <g transform="translate(48, 16)">
    <circle cx="0" cy="0" r="6" fill="#0284c7" opacity="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#f0f9ff"/>
  </g>
  
  <!-- 装饰性箭头 -->
