  <rect x="21" y="28" width="14" height="4" fill="#be185d" rx="0.5"/>
  <!-- 箭头 -->
  <path d="M6 26 L6 18" stroke="#9d174d" stroke-width="1" marker-end="url(#arrow-pink)"/>
  <path d="M14 12 L20 12" stroke="#9d174d" stroke-width="1" marker-end="url(#arrow-pink)"/>
  <text x="28" y="13" text-anchor="middle" fill="white" font-size="3" font-weight="bold">0</text>
  <text x="28" y="19" text-anchor="middle" fill="white" font-size="3" font-weight="bold">1</text>
  <text x="28" y="25" text-anchor="middle" fill="white" font-size="3" font-weight="bold">2</text>
  <text x="28" y="31" text-anchor="middle" fill="white" font-size="3" font-weight="bold">3</text>
