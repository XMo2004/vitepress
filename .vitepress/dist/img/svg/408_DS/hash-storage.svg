<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-pink" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#9d174d"/>
    </marker>
  </defs>
  <!-- 散列函数 -->
  <circle cx="8" cy="12" r="6" fill="none" stroke="#9d174d" stroke-width="1"/>
  <text x="8" y="14" text-anchor="middle" fill="#9d174d" font-size="4" font-weight="bold">H(k)</text>
  <!-- 输入 -->
  <rect x="2" y="24" width="4" height="4" fill="#9d174d" rx="0.5"/>
  <text x="4" y="27" text-anchor="middle" fill="white" font-size="3" font-weight="bold">K</text>
  <!-- 散列表 -->
  <rect x="20" y="8" width="16" height="24" fill="none" stroke="#9d174d" stroke-width="1" rx="1"/>
  <rect x="21" y="10" width="14" height="4" fill="#be185d" rx="0.5"/>
  <rect x="21" y="16" width="14" height="4" fill="#be185d" rx="0.5"/>
